name: CICD

on:
  push:
  release:
    types:
      - created

env:
  GO_VERSION: "1.23"

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
      - name: Deps
        run: make deps
      - name: Build
        run: make build
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
      - name: Deps
        run: make deps
      - name: Test
        run: make test
  Dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
      - name: Deps
        run: make deps
      - name: Dependencies
        run: make check-mod
  Lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
      - name: Lint
        uses: golangci/golangci-lint-action@v6
  Prerelease:
    name: Prerelease
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && github.event.release.prerelease }}
    needs: [Build, Test, Dependencies, Lint]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config ".goreleaser.prerelease.yml"
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_HOST: ${{ secrets.AUTH0_HOST }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          SEQTOID_BASE_URL: ${{ secrets.SEQTOID_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  Release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: [Build, Test, Dependencies, Lint]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Mint a short-lived installation token from the GH_ACTIONS_HELPER GitHub App to
      # publish the Homebrew cask + scoop manifest (which live in separate repos). This is
      # the fleet-standard cross-repo write mechanism (see seqtoid-web promote-to-env.yml /
      # rollup workflows) -- no long-lived personal PAT. Requires the app to be installed on
      # homebrew-tap + scoop-seqtoid with Contents:write, and repo var CI_APP_ENABLED=true.
      # On a fork without the app the step is skipped and the publish step below no-ops.
      - name: Generate app token
        id: app_token
        if: ${{ vars.CI_APP_ENABLED == 'true' }}
        uses: chanzuckerberg/github-app-token@365b1f2db827eb8f17288ec335b1a7e3c03ff683 # v1.1.4
        with:
          app_id: ${{ secrets.GH_ACTIONS_HELPER_APP_ID }}
          private_key: ${{ secrets.GH_ACTIONS_HELPER_PK }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config ".goreleaser.yml"
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_HOST: ${{ secrets.AUTH0_HOST }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          SEQTOID_BASE_URL: ${{ secrets.SEQTOID_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # App-minted installation token with write access to BOTH public dist repos
          # (homebrew-tap + scoop-seqtoid). Falls back to the PUBLISH_GITHUB_TOKEN secret if
          # the app path is disabled, so an explicit PAT still works as an override.
          PUBLISH_GITHUB_TOKEN: ${{ steps.app_token.outputs.token || secrets.PUBLISH_GITHUB_TOKEN }}

  # Non-blocking release-notes recording. Fires ONLY after a successful non-prerelease Release and calls
  # the shared collector in seqtoid-web. It never gates or delays the release: it `needs:` the Release
  # job, runs only on its success, and the reusable workflow is all-continue-on-error and self-no-ops
  # unless the changelog-<env> Environment is provisioned. The CLI is env-agnostic (a client tool, not
  # deployed to an env); it is recorded to the public feed under prod. See the PR body: WHICH env(s) a
  # CLI release records to is a product decision to confirm.
  record-changelog:
    name: Record cli release notes (non-blocking)
    needs: Release
    if: ${{ always() && needs.Release.result == 'success' }}
    uses: IT-Academic-Research-Services/seqtoid-web/.github/workflows/record-changelog.yml@main
    with:
      env_name: prod
      component: cli
      source_repo: IT-Academic-Research-Services/seqtoid-cli
      new_sha: ${{ github.sha }}
      default_piece: "Command-line tool"
    secrets: inherit
    permissions:
      contents: read
      id-token: write
