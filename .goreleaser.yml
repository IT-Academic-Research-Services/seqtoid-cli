version: 2

before:
  hooks:
    - go mod tidy

builds:
- id: "build-with-completions"
  binary: seqtoid
  env:
    - CGO_ENABLED=0
  goos:
    - linux
  goarch:
    - amd64
  ldflags: &ldflags
    - -s -w
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg.Version={{.Version}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultClientID={{.Env.AUTH0_CLIENT_ID}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultAuth0Host={{.Env.AUTH0_HOST}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultAudience={{.Env.AUTH0_AUDIENCE}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/seqtoid.defaultBaseURL={{.Env.SEQTOID_BASE_URL}}
  hooks:
    post: "scripts/generate_completions.sh {{.Path}}"
- binary: seqtoid
  env:
    - CGO_ENABLED=0
  goos:
    - darwin
    - windows
  goarch:
    - amd64
    - arm64
  ignore:
    - goos: linux
      goarch: amd64
    - goos: windows
      goarch: arm64
  ldflags: *ldflags

release:
  prerelease: false

archives:
  # Default without version for easy latest release linking
  - name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}{{if .Mips}}_{{.Mips}}{{end}}"
    wrap_in_directory: true
    format_overrides:
    - goos: windows
      formats: [ 'zip' ]
    files:
    - LICENSE.md
    - README.md
    - bash_completion
    - zsh_completion
    - fish_completion
    - powershell_completion
    # Ship the per-environment config profiles so one package targets dev or env-staging
    # at runtime (seqtoid --config <profile>). See config/README.md.
    - config/dev.yaml
    - config/env-staging.yaml
    - config/README.md

homebrew_casks:
- name: seqtoid
  description: "A CLI for uploading samples to SeqToID"
  repository:
    owner: IT-Academic-Research-Services
    name: homebrew-tap
    token: "{{.Env.PUBLISH_GITHUB_TOKEN}}"
  homepage: "https://github.com/IT-Academic-Research-Services/seqtoid-cli"
  completions:
    bash: "bash_completion"
    zsh: "zsh_completion"
    fish: "fish_completion"
  # The released binaries are not (yet) codesigned/notarized, so strip the macOS quarantine
  # attribute on install to avoid Gatekeeper blocking the CLI. Revisit once signing is set up.
  hooks:
    post:
      install: |
        if OS.mac? && File.exist?("#{staged_path}/seqtoid")
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/seqtoid"]
        end

# Windows distribution via Scoop. Publishes a manifest to the public scoop-seqtoid bucket from the
# Windows archives, so users can: scoop bucket add seqtoid https://github.com/IT-Academic-Research-Services/scoop-seqtoid
# then `scoop install seqtoid`.
scoops:
- name: seqtoid
  repository:
    owner: IT-Academic-Research-Services
    name: scoop-seqtoid
    token: "{{.Env.PUBLISH_GITHUB_TOKEN}}"
  homepage: "https://github.com/IT-Academic-Research-Services/seqtoid-cli"
  description: "A CLI for uploading samples to SeqToID"
  license: MIT

nfpms:
  -
    vendor: IT-Academic-Research-Services
    maintainer: Academic Research Services <its-arssupport@ucsf.edu>
    homepage: "https://github.com/IT-Academic-Research-Services/seqtoid-cli"
    description: "A CLI for uploading samples to SeqToID"
    license: MIT
    # Default without version for easy latest release linking
    file_name_template: "{{.PackageName}}_{{ .Os }}_{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}{{if .Mips}}_{{.Mips}}{{end}}"
    formats:
      - deb
      - rpm
    contents:
      - src: "bash_completion"
        dst: "/etc/bash_completion.d/seqtoid"
      - src: "zsh_completion"
        dst: "/usr/share/zsh/functions/Completion/seqtoid"
      # Per-environment config profiles (dev / env-staging) shipped as example configs.
      - src: "config/dev.yaml"
        dst: "/etc/seqtoid-cli/dev.yaml"
        type: config
      - src: "config/env-staging.yaml"
        dst: "/etc/seqtoid-cli/env-staging.yaml"
        type: config

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"
