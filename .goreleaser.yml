version: 2

before:
  hooks:
    - go mod tidy

builds:
- id: "build-with-completions"
  binary: seqtoid
  env:
    - CGO_ENABLED=0
  goos:
    - linux
  goarch:
    - amd64
  ldflags: &ldflags
    - -s -w
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg.Version={{.Version}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultClientID={{.Env.AUTH0_CLIENT_ID}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultAuth0Host={{.Env.AUTH0_HOST}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultAudience={{.Env.AUTH0_AUDIENCE}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/seqtoid.defaultBaseURL={{.Env.SEQTOID_BASE_URL}}
  hooks:
    post: "scripts/generate_completions.sh {{.Path}}"
# Cross-compiled targets that do NOT run the completion post-hook. The hook execs the
# freshly built binary to emit completion scripts, which only works for a natively
# runnable target on the amd64 CI runner -- so linux/amd64 is built above and the
# arch-independent completion files it produces are shipped into every archive/package
# by path. linux/arm64 (Ubuntu on Graviton/ARM) is built here without re-running the hook;
# the linux/amd64 entry stays ignored so it is not duplicated with build-with-completions.
- binary: seqtoid
  env:
    - CGO_ENABLED=0
  goos:
    - linux
    - darwin
    - windows
  goarch:
    - amd64
    - arm64
  ignore:
    - goos: linux
      goarch: amd64
    - goos: windows
      goarch: arm64
  ldflags: *ldflags

release:
  prerelease: false

archives:
  # Default without version for easy latest release linking
  - name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}{{if .Mips}}_{{.Mips}}{{end}}"
    # false: extract files at the archive root (no seqtoid-cli_<os>_<arch>/ wrapper). goreleaser's
    # generated Homebrew cask only un-nests the binary via `rename`, NOT the completion files, so with
    # wrapping the `bash_completion`/`zsh_completion`/`fish_completion` stanzas point at paths that do
    # not exist and `brew install` fails on a dangling symlink. Unwrapped, binary + completions + the
    # scoop bin path all resolve at the staged root.
    wrap_in_directory: false
    format_overrides:
    - goos: windows
      formats: [ 'zip' ]
    files:
    - LICENSE.md
    - README.md
    # Completions are generated under completions/<shell>/seqtoid (see scripts/generate_completions.sh)
    # so Homebrew/nfpm install them with idiomatic, command-named targets.
    - completions/bash/seqtoid
    - completions/zsh/seqtoid
    - completions/fish/seqtoid
    - completions/powershell/seqtoid
    # Ship the per-environment config profiles so one package targets dev or env-staging
    # at runtime (seqtoid --config <profile>). See config/README.md.
    - config/dev.yaml
    - config/env-staging.yaml
    - config/README.md

homebrew_casks:
- name: seqtoid
  description: "A CLI for uploading samples to SeqToID"
  repository:
    owner: IT-Academic-Research-Services
    name: homebrew-tap
    token: "{{.Env.PUBLISH_GITHUB_TOKEN}}"
  homepage: "https://github.com/IT-Academic-Research-Services/seqtoid-cli"
  # Homebrew derives the install target from each file's basename: seqtoid ->
  # bash_completion.d/seqtoid, _seqtoid (zsh autoload), seqtoid.fish.
  completions:
    bash: "completions/bash/seqtoid"
    zsh: "completions/zsh/seqtoid"
    fish: "completions/fish/seqtoid"
  # The released binaries are not (yet) codesigned/notarized, so strip the macOS quarantine
  # attribute on install to avoid Gatekeeper blocking the CLI. Revisit once signing is set up.
  hooks:
    post:
      install: |
        if OS.mac? && File.exist?("#{staged_path}/seqtoid")
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/seqtoid"]
        end

# Windows distribution via Scoop. Publishes a manifest to the public scoop-seqtoid bucket from the
# Windows archives, so users can: scoop bucket add seqtoid https://github.com/IT-Academic-Research-Services/scoop-seqtoid
# then `scoop install seqtoid`.
scoops:
- name: seqtoid
  repository:
    owner: IT-Academic-Research-Services
    name: scoop-seqtoid
    token: "{{.Env.PUBLISH_GITHUB_TOKEN}}"
  homepage: "https://github.com/IT-Academic-Research-Services/seqtoid-cli"
  description: "A CLI for uploading samples to SeqToID"
  license: MIT

nfpms:
  -
    vendor: IT-Academic-Research-Services
    maintainer: Academic Research Services <its-arssupport@ucsf.edu>
    homepage: "https://github.com/IT-Academic-Research-Services/seqtoid-cli"
    description: "A CLI for uploading samples to SeqToID"
    license: MIT
    # Default without version for easy latest release linking
    file_name_template: "{{.PackageName}}_{{ .Os }}_{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}{{if .Mips}}_{{.Mips}}{{end}}"
    formats:
      - deb
      - rpm
    contents:
      - src: "completions/bash/seqtoid"
        dst: "/etc/bash_completion.d/seqtoid"
      - src: "completions/zsh/seqtoid"
        # zsh autoloads completion files named _<command> from its fpath.
        dst: "/usr/share/zsh/vendor-completions/_seqtoid"
      - src: "completions/fish/seqtoid"
        dst: "/usr/share/fish/vendor_completions.d/seqtoid.fish"
      # Per-environment config profiles (dev / env-staging) shipped as example configs.
      - src: "config/dev.yaml"
        dst: "/etc/seqtoid-cli/dev.yaml"
        type: config
      - src: "config/env-staging.yaml"
        dst: "/etc/seqtoid-cli/env-staging.yaml"
        type: config

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"
