# seqtoid-cli — ENV-STAGING environment profile (env-staging.seqtoid.org)
#
# Usage:
#   seqtoid --config /path/to/config/env-staging.yaml <command>
# or copy to ~/.config/seqtoid-cli/config.yaml, or set SEQTOID_CLI_* env vars.
#
# These are public OAuth client config (native app / device flow — NO client secret).
