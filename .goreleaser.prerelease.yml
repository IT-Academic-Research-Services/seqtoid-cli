version: 2

before:
  hooks:
    - go mod tidy

builds:
- id: "build-with-completions"
  binary: seqtoid
  env:
    - CGO_ENABLED=0
  goos:
    - linux
  goarch:
    - amd64
  ldflags: &ldflags
    - -s -w
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg.Version={{.Version}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultClientID={{.Env.AUTH0_CLIENT_ID}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultAuth0Host={{.Env.AUTH0_HOST}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/auth0.defaultAudience={{.Env.AUTH0_AUDIENCE}}
    - -X github.com/IT-Academic-Research-Services/seqtoid-cli/pkg/seqtoid.defaultBaseURL={{.Env.SEQTOID_BASE_URL}}
  hooks:
    post: "scripts/generate_completions.sh {{.Path}}"
# Cross-compiled targets that do NOT run the completion post-hook. The hook execs the
# freshly built binary to emit completion scripts, which only works for a natively
# runnable target on the amd64 CI runner -- so linux/amd64 is built above and the
# arch-independent completion files it produces are shipped into every archive/package
# by path. linux/arm64 (Ubuntu on Graviton/ARM) is built here without re-running the hook;
# the linux/amd64 entry stays ignored so it is not duplicated with build-with-completions.
- binary: seqtoid
  env:
    - CGO_ENABLED=0
  goos:
    - linux
    - darwin
    - windows
  goarch:
    - amd64
    - arm64
  ignore:
    - goos: linux
      goarch: amd64
    - goos: windows
      goarch: arm64
  ldflags: *ldflags

release:
  prerelease: true

archives:
  # Default without version for easy latest release linking
  - name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}{{if .Mips}}_{{.Mips}}{{end}}"
    # false: keep archive layout consistent with .goreleaser.yml (see the note there -- a wrapped
    # archive breaks the generated Homebrew cask's completion symlinks).
    wrap_in_directory: false
    format_overrides:
    - goos: windows
      formats: [ 'zip' ]
    files:
    - LICENSE.md
    - README.md
    # Command-named completions (see scripts/generate_completions.sh); mirrors .goreleaser.yml.
    - completions/bash/seqtoid
    - completions/zsh/seqtoid
    - completions/fish/seqtoid
    - completions/powershell/seqtoid
    # Ship the per-environment config profiles so one package targets dev or env-staging
    # at runtime (seqtoid --config <profile>). Mirrors the full-release .goreleaser.yml
    # so prereleases are not missing the profiles. See config/README.md.
    - config/dev.yaml
    - config/env-staging.yaml
    - config/README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"
